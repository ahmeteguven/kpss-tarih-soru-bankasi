name: kpss_tarih_soru_bankasi
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # --- MEVCUT PAKETLER ---
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  shared_preferences: ^2.2.2
  firebase_core: ^3.6.0 # Sürüm uyumu için güncel olması iyidir, seninkini korudum ama hata verirse güncellemek gerekir.
  firebase_messaging: ^15.1.3 # Sürüm uyumu gerekebilir, mevcut halini korudum.
  connectivity_plus: ^6.0.3

  # --- YENİ EKLENENLER (PREMIUM & REKLAM SİSTEMİ) ---
  google_mobile_ads: ^5.2.0 # AdMob Reklamları
  purchases_flutter: ^8.3.0 # RevenueCat (Abonelikler)
  firebase_auth: ^5.3.1 # Kullanıcı Kimlik Doğrulama
  google_sign_in: ^6.2.1 # Google ile Giriş

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/topics/
    - assets/denemeler/
    - assets/quotes/quotes.json
    - assets/hap_bilgiler/
    - assets/dictionary.json
    - assets/konu_ozeti/
    - assets/onboarding/

  uses-material-design: true
